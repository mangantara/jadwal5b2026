<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer Jadwal Kelas 5B</title>
<style>
:root{
  --bg:#f5f8ff; --card:#ffffff; --card2:#eef4ff; --text:#172033;
  --muted:#68738a; --accent:#159f72; --warn:#d89000; --danger:#dc4c4c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:auto;background:linear-gradient(135deg,#f7fbff 0%,#eef5ff 100%)}
.wrap{max-width:1250px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
.title{font-size:clamp(24px,4vw,42px);font-weight:800}
.sub{color:var(--muted);margin-top:5px;font-size:15px}
.clock{text-align:right}
.clock .time{font-size:clamp(25px,4vw,42px);font-weight:800}
.clock .date{color:var(--muted)}
.hero{background:#ffffff;border:1px solid #dce6f5;border-radius:24px;padding:28px;text-align:center;box-shadow:0 12px 30px rgba(61,89,130,.12)}
.status{font-size:clamp(18px,2.5vw,28px);color:var(--accent);font-weight:700}
.subject{font-size:clamp(38px,7vw,82px);font-weight:900;margin:8px 0}
.remaining{font-size:clamp(70px,13vw,150px);font-weight:900;letter-spacing:2px;line-height:1}
.until{font-size:18px;color:var(--muted);margin:10px 0 18px}
.progress{height:16px;background:#e5edf8;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0%;background:var(--accent);transition:width .5s}
.next{margin-top:18px;color:var(--muted);font-size:16px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
button{border:1px solid #d6e1f1;border-radius:12px;padding:11px 17px;background:var(--card);color:var(--text);cursor:pointer;font-weight:700;box-shadow:0 2px 7px rgba(50,80,120,.08)}
button:hover{filter:brightness(1.15)}
button.active{background:var(--accent);color:#ffffff;border-color:var(--accent)}
button.full{background:#e8f0ff;color:#23406f}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.day{background:rgba(255,255,255,.95);border:1px solid #dce6f5;border-radius:16px;padding:12px;box-shadow:0 5px 18px rgba(61,89,130,.07)}
.day h3{margin:0 0 8px;text-align:center;font-size:16px}
.item{padding:10px;border-radius:10px;margin:6px 0;background:#f1f6fd;font-size:13px;border:1px solid #e2eaf5}
.item .time{font-weight:800;color:var(--accent)}
.item.now{outline:2px solid var(--accent);background:#e7f8f1}
.item.rest{background:#fff8e7}
.item.rest .time{color:var(--warn)}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){
  .wrap{padding:12px}.top{align-items:flex-start}.clock{text-align:right}
  .grid{grid-template-columns:1fr}.hero{padding:20px 12px}.subject{font-size:42px}
}
.fullscreen .wrap{max-width:1500px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">⏱️ Timer Kelas 5B</div>
      <div class="sub">Jadwal otomatis • offline • berdasarkan jam perangkat</div>
    </div>
    <div class="clock">
      <div id="clock" class="time">00:00:00</div>
      <div id="date" class="date"></div>
    </div>
  </div>

  <section class="hero">
    <div id="status" class="status">Memuat jadwal...</div>
    <div id="subject" class="subject">—</div>
    <div id="remaining" class="remaining">00:00:00</div>
    <div id="until" class="until">—</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="next" class="next">—</div>
  </section>

  <div class="controls">
    <button id="todayBtn" class="active" onclick="selectDay('today')">Hari Ini</button>
    <button onclick="selectDay(1)">Senin</button>
    <button onclick="selectDay(2)">Selasa</button>
    <button onclick="selectDay(3)">Rabu</button>
    <button onclick="selectDay(4)">Kamis</button>
    <button onclick="selectDay(5)">Jumat</button>
    <button class="full" onclick="toggleFullscreen()">⛶ Layar Penuh</button>
  </div>

  <div id="schedule" class="grid"></div>
  <div class="note">Timer berjalan sepenuhnya di perangkat. Tidak membutuhkan internet.</div>
</div>

<script>
const schedules = {
1:[
 ["07:00","07:30","Upacara Bendera"],
 ["07:30","09:15","Bahasa Indonesia"],
 ["09:15","09:30","Istirahat I","rest"],
 ["09:30","11:15","Matematika"],
 ["11:15","11:30","Istirahat II","rest"],
 ["11:30","13:15","Seni"]
],
2:[
 ["07:30","08:40","PJOK"],
 ["08:40","09:15","Teori PJOK"],
 ["09:15","09:30","Istirahat I","rest"],
 ["09:30","11:15","Kokurikuler"],
 ["11:15","11:30","Istirahat II","rest"],
 ["11:30","13:15","IPAS"]
],
3:[
 ["07:30","08:40","Bahasa Inggris"],
 ["08:40","09:15","IPAS"],
 ["09:15","09:30","Istirahat I","rest"],
 ["09:30","10:05","IPAS"],
 ["10:05","11:15","Bahasa Indonesia"],
 ["11:15","11:30","Istirahat II","rest"],
 ["11:30","12:05","Bahasa Indonesia"],
 ["12:05","13:15","Pendidikan Pancasila"]
],
4:[
 ["07:30","08:40","Bahasa Bali"],
 ["08:40","09:15","Pendidikan Pancasila"],
 ["09:15","09:30","Istirahat I","rest"],
 ["09:30","10:05","Pendidikan Pancasila"],
 ["10:05","11:15","Matematika"],
 ["11:15","11:30","Istirahat II","rest"],
 ["11:30","13:15","Agama"]
],
5:[
 ["07:30","09:15","Kokurikuler"],
 ["09:15","09:30","Istirahat I","rest"],
 ["09:30","10:05","Kokurikuler"],
 ["10:05","10:40","Ekstrakurikuler"],
 ["10:40","10:55","Istirahat II","rest"],
 ["10:55","12:05","Ekstrakurikuler"]
]
};
const dayNames=["","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
let selectedDay="today";

function mins(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function pad(n){return String(n).padStart(2,"0")}
function format(sec){
 sec=Math.max(0,Math.floor(sec));
 return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`
}
function currentDay(){
 const d=new Date().getDay();
 return d===0?7:d;
}
function currentMinutes(){
 const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
}
function selectDay(day){
 selectedDay=day;
 document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));
 if(day==="today") document.getElementById("todayBtn").classList.add("active");
 else [...document.querySelectorAll(".controls button")].find(b=>b.textContent===dayNames[day])?.classList.add("active");
 renderSchedule(day==="today"?currentDay():day);
 update();
}
function renderSchedule(day){
 const data=schedules[day]||[];
 document.getElementById("schedule").innerHTML=data.map((x,i)=>
 `<div class="day">
   <h3>${dayNames[day]}</h3>
   <div class="item ${x[3]==="rest"?"rest":""}" id="item-${i}">
     <div class="time">${x[0]} – ${x[1]}</div>
     <div>${x[2]}</div>
   </div>
 </div>`).join("");
 // Untuk tampilan daftar yang lebih rapi: gabungkan semua sesi menjadi satu kolom pada kartu hari
 document.getElementById("schedule").innerHTML =
 `<div class="day" style="grid-column:1/-1">
   <h3 style="text-align:left;font-size:20px">${dayNames[day]}</h3>
   ${data.map((x,i)=>`<div class="item ${x[3]==="rest"?"rest":""}" id="item-${i}">
     <div class="time">${x[0]} – ${x[1]}</div><div>${x[2]}</div>
   </div>`).join("")}
 </div>`;
}
function update(){
 const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString("id-ID",{hour12:false});
 document.getElementById("date").textContent=now.toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});

 const day=selectedDay==="today"?currentDay():selectedDay;
 const data=schedules[day]||[];
 const cm=currentMinutes();

 let idx=data.findIndex(x=>cm>=mins(x[0]) && cm<mins(x[1]));
 const subject=document.getElementById("subject"), status=document.getElementById("status");
 const remaining=document.getElementById("remaining"), until=document.getElementById("until");
 const next=document.getElementById("next"), bar=document.getElementById("bar");

 document.querySelectorAll(".item").forEach(e=>e.classList.remove("now"));

 if(selectedDay==="today"){
   if(idx>=0){
     const x=data[idx];
     const left=(mins(x[1])-cm)*60;
     const total=(mins(x[1])-mins(x[0]))*60;
     const elapsed=(cm-mins(x[0]))*60;
     subject.textContent=x[2];
     status.textContent=x[3]==="rest"?"☕ WAKTU ISTIRAHAT":"📚 SEDANG BERLANGSUNG";
     remaining.textContent=format(left);
     until.textContent=`Selesai pukul ${x[1]}`;
     bar.style.width=Math.min(100,Math.max(0,elapsed/total*100))+"%";
     const nx=data[idx+1];
     next.textContent=nx?`Berikutnya: ${nx[2]} • ${nx[0]}`:"Ini adalah kegiatan terakhir hari ini.";
     document.getElementById("item-"+idx)?.classList.add("now");
   }else{
     const nextIdx=data.findIndex(x=>cm<mins(x[0]));
     if(nextIdx>=0){
       const x=data[nextIdx];
       subject.textContent=x[2];
       status.textContent="⏳ SEGERA DIMULAI";
       remaining.textContent=format((mins(x[0])-cm)*60);
       until.textContent=`Mulai pukul ${x[0]}`;
       bar.style.width="0%";
       next.textContent="Bersiap untuk kegiatan berikutnya.";
     }else{
       subject.textContent="Selesai";
       status.textContent="🏠 JAM PELAJARAN SELESAI";
       remaining.textContent="00:00:00";
       until.textContent="Sampai jumpa besok";
       bar.style.width="100%";
       next.textContent="Tidak ada kegiatan lagi hari ini.";
     }
   }
 }else{
   subject.textContent="Mode Jadwal";
   status.textContent=dayNames[day];
   remaining.textContent="—";
   until.textContent="Tekan “Hari Ini” untuk timer otomatis.";
   bar.style.width="0%";
   next.textContent="Menampilkan jadwal lengkap.";
 }
}
function toggleFullscreen(){
 if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
}
selectDay("today");
setInterval(update,250);
</script>
</body>
</html>
